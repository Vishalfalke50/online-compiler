spring.application.name=online-compiler

# Run the app on port 8081 instead of 8080
server.port=8081
# Oracle database connection: URL, username and password
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=compiler
spring.datasource.password=root

# Hibernate: auto-create tables from entities and show SQL in console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# JWT secret key
jwt.secret=${JWT_SECRET}

# JWT token expiration time (24 hours)
jwt.expiration-ms=86400000

# Judge0 CE public endpoint (no RapidAPI subscription or API key)
judge0.url=https://ce.judge0.com


# Gemini API: base URL, key and models tried in order (if one is busy or retired, the next is used)
gemini.url=https://generativelanguage.googleapis.com
gemini.api.key=${GEMINI_API_KEY}
gemini.models=gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash

# Groq API: last fallback if every Gemini model fails (key is read from the GROQ_API_KEY environment variable)
groq.url=https://api.groq.com/openai/v1
groq.model=llama-3.3-70b-versatile
groq.api.key=${GROQ_API_KEY:}